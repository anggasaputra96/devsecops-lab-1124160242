name: DevSecOps Shift-Left Security Pipeline
on: [push]
jobs:
  sast_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: pipx install semgrep && semgrep scan --config p/default --config p/secrets || true
  sca_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH, CRITICAL'
          exit-code: '1'
