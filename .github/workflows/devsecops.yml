name: DevSecOps Shift-Left Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sast_scan:
      name: Run SAST Scan (Semgrep)
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Source Code
          uses: actions/checkout@v3

        - name: Run Semgrep SAST
          uses: semgrep/semgrep-action@v1
          with:
            config: p/ci

  sca_scan:
    name: Run SCA Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH, CRITICAL'
          exit-code: '1' # Memaksa pipeline berstatus GAGAL jika ada celah High/Critical